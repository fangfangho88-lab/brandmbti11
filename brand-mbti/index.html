'use strict';
const VERSION='1.0',RULE_VERSION='1.1',KEY='brand-mbti-1.0',NAMES=['信念型','探索型','创造型','共生型','经营型','秩序型'],MAP=[[1,8,16],[2,10,18],[3,11,19],[5,12,21],[6,14,22],[7,15,23]];

let state={answers:{},index:0,brand:'',feedback:{}};let storageOK=true;try{const saved=JSON.parse(localStorage.getItem(KEY));if(saved&&saved.version===VERSION){state={...state,...saved};state.index=Math.max(0,Math.min(23,Number(state.index)||0));state.answers=state.answers||{};}}catch{storageOK=false}
const app=document.querySelector('#app');const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function save(){try{localStorage.setItem(KEY,JSON.stringify({...state,version:VERSION}));}catch{storageOK=false}}
function valid(q,a){return a==='unknown'||(q.options.length?q.options.some(o=>o[0]===a):Number.isInteger(a)&&a>=1&&a<=5)}
function calculate(answers){if(!QUESTIONS.every(q=>valid(q,answers[q.id])))throw Error('请完成全部24题');const scores=MAP.map(ids=>{const v=ids.map(id=>answers[id]).filter(x=>typeof x==='number');return v.length>=2?v.reduce((a,b)=>a+b,0)/v.length:null});const counts=NAMES.map((_,i)=>QUESTIONS.filter(q=>q.options.length&&answers[q.id]==='ABCDEF'[i]).length);const ranked=scores.map((v,i)=>({v,i})).filter(x=>x.v!==null).sort((a,b)=>b.v-a.v);const enough=scores.every(v=>v!==null);const flat=enough&&Math.abs(ranked[0].v-ranked[5].v)<1e-9;const major=enough&&!flat?ranked.filter(x=>ranked[0].v-x.v<0.4-1e-9).map(x=>x.i):[];const clear=enough&&!flat&&ranked[0].v>=3.5&&major.length===1;const lead=clear?[ranked[0].i]:[];const rest=ranked.filter(x=>!major.includes(x.i));const companions=clear&&rest.length?rest.filter(x=>Math.abs(x.v-rest[0].v)<1e-9).map(x=>x.i):[];return {scores,counts,lead,major,companions,clear,status:!enough?'insufficient':flat?'undifferentiated':clear?'dominant':'relative',mixed:major.length>1,validScale:MAP.map(ids=>ids.filter(id=>typeof answers[id]==='number').length),scenarioValid:counts.reduce((a,b)=>a+b,0)};}

function home(){app.innerHTML='<p class="eyebrow">品牌生命系统 / 01</p><h1>看见品牌习惯的<br>做事方式。</h1><p>24道题，回顾品牌过去一年的真实经营行为。没有标准正确答案，请选择团队通常的做法。</p><div class="card"><b>18道量表 · 6道情境 · 六维观察</b><p>这是探索性未验证模型，尚未经过大样本心理测量验证。结果反映本次作答者的观察，不是组织客观诊断，也不是能力或成熟度评级。</p><label>品牌名称（选填）<input id="brand" maxlength="80" placeholder="也可以匿名作答"></label><div id="start" class="actions"></div></div>';document.querySelector('#brand').value=state.brand;document.querySelector('#start').append(button(Object.keys(state.answers).length?'继续测评':'开始测评',()=>{state.brand=document.querySelector('#brand').value.trim();save();question()},'primary'));}
function question(){const q=QUESTIONS[state.index];const done=QUESTIONS.filter(q=>valid(q,state.answers[q.id])).length;app.innerHTML=`<p class="eyebrow">真实行为 / 过去一年</p><p>第 ${state.index+1} / 24 题 · 已作答 ${done} 题</p><progress max="24" value="${done}" aria-label="答题进度"></progress><div class="card"><h2 tabindex="-1">${esc(q.text)}</h2><p>${q.options.length?'请选择团队通常最先做的事，而不是最终会做的全部事情。':'请选择与实际经营行为的符合程度。'}</p><div class="options" role="radiogroup" aria-label="答案选项"></div><p id="error" role="alert" class="error"></p><div class="actions" id="nav"></div></div><small>${storageOK?'答案自动保存在当前浏览器。':'当前浏览器无法保存进度，请在离开前导出记录。'} 缺少实际经历时可选择“暂时无法判断”。</small>`;const options=q.options.length?q.options:[[1,'完全不像'],[2,'不太像'],[3,'有时候像'],[4,'比较像'],[5,'非常像']];for(const [v,t] of [...options,['unknown','暂时无法判断']]){const b=button(`${v==='unknown'?'':v+' · '}${t}`,()=>{state.answers[q.id]=v;save();question()});b.setAttribute('role','radio');b.setAttribute('aria-checked',String(state.answers[q.id]===v));document.querySelector('.options').append(b)}const nav=document.querySelector('#nav');if(state.index>0)nav.append(button('上一题',()=>{state.index--;save();question()}));nav.append(button(state.index===23?'生成报告':'下一题',()=>{if(!valid(q,state.answers[q.id])){document.querySelector('#error').textContent='请选择一个答案，也可选择暂时无法判断。';return}if(state.index<23){state.index++;save();question();app.querySelector('h2').focus()}else{const missing=QUESTIONS.find(q=>!valid(q,state.answers[q.id]));if(missing){state.index=missing.id-1;question();return}state.submittedAt=new Date().toISOString();save();report()}},'primary'));nav.append(button('导出当前记录',()=>download()));}
function payload(){let result=null;try{result=calculate(state.answers)}catch{}return {assessment_version:VERSION,report_version:RULE_VERSION,result_rule_version:RULE_VERSION,exported_at:new Date().toISOString(),submitted_at:state.submittedAt||null,brand:state.brand,answers:Object.fromEntries(QUESTIONS.map(q=>['Q'+q.id,state.answers[q.id]??null])),result,feedback:state.feedback,model_status:'探索性未验证模型'}}
function download(){const url=URL.createObjectURL(new Blob([JSON.stringify(payload(),null,2)],{type:'application/json;charset=utf-8'}));const a=document.createElement('a');a.href=url;a.download='brand-mbti-results-1.1.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function report(){const r=calculate(state.answers);const list=ids=>ids.map(i=>NAMES[i]).join('、')||'暂无';const chart=(values,max)=>NAMES.map((name,i)=>`<div class="row"><span>${name}</span><div class="track"><div class="fill" style="width:${(values[i]??0)/max*100}%"></div></div><b>${values[i]===null?'不足':max===5?values[i].toFixed(2):values[i]}</b></div>`).join('');const focus=r.major;const label=r.clear?'主导人格':'当前主要倾向';const summary=r.status==='insufficient'?'部分维度观察不足，先呈现已获得的行为信息。':r.status==='undifferentiated'?'六维同分，当前答案未呈现可区分的主要倾向。':r.clear?'本次量表呈现相对突出的维度，仍需案例核对。':'本次呈现相对较高的倾向，暂不指定单一主导人格。';const scenarioTop=r.scenarioValid?NAMES.filter((_,i)=>r.counts[i]===Math.max(...r.counts)).join('、'):'暂无有效选择';const probes=MAP.map((ids,i)=>({i,ids:ids.filter(id=>typeof state.answers[id]==='number')})).map(o=>({...o,range:o.ids.length?Math.max(...o.ids.map(id=>state.answers[id]))-Math.min(...o.ids.map(id=>state.answers[id])):0})).filter(o=>o.range>=2);const questions=probes.map(o=>`<p>${NAMES[o.i]}相关题目出现不同回答：${o.ids.map(id=>'Q'+id+'（'+esc(QUESTIONS[id-1].text)+'）：'+state.answers[id]).join('；')}。请分别回顾一次真实经历：差异来自业务场景、团队分工，还是题意难以判断？这只是访谈线索，不是测量误差判定。</p>`).join('');const profiles=focus.map(i=>`<h3>${NAMES[i]}</h3><p>${COPY[i][0]}</p><p>相关题目：${MAP[i].map(n=>'Q'+n+'='+state.answers[n]).join('、')}。</p>`).join('');const block=(n,t,c)=>`<section><p class="eyebrow">0${n} / REPORT</p><h2>${t}</h2>${c}</section>`;app.innerHTML=`<p class="eyebrow">BRAND MBTI / 题库1.0 · 报告1.1</p><h1>${esc(state.brand||'你的品牌')}<br>人格观察报告</h1><p>${label}：<b>${list(focus)}</b><br>伴随人格：${list(r.companions)}</p><p class="note">${summary} ${r.mixed?'多个维度与最高分的差距小于0.4，暂列为主要倾向，不据此确认稳定混合人格。 ':''}探索性未验证模型。描述的是当前行为倾向，不代表能力、成熟度或永久身份。</p>`+
block(1,'六维品牌人格画像',chart(r.scores,5)+'<p>量表均分 / 5分，各维度至少2题有效才计分。</p><h3>情境选择的交叉观察</h3>'+chart(r.counts,6)+`<p>选择次数 / 6次；有效情境题 ${r.scenarioValid}/6。情境结果独立呈现，不与量表混算。差异可用于回顾实际决策，不能直接认定量表与行为一致。</p>`)+
block(2,'你的品牌是什么样的？',(profiles||'<p>当前没有足够依据突出某个人格。可从已经回答的具体行为开始复盘。</p>')+'<h3>值得核对的行为差异</h3>'+(questions||'<p>本次未出现达到当前访谈提示条件的题间差异；这不证明行为一致或模型有效。</p>'))+
block(3,'你的品牌在真实经营中',`<p>情境题中较常优先选择：${scenarioTop}。请与上述量表倾向对照，回顾一次实际决策：最先想到的做法是否真的影响了最后行动？两种统计保持独立，不用于互相修正。</p>`+focus.map(i=>`<p>${COPY[i][1]}这是一种待核对的可能情境，请用具体案例验证。</p>`).join('')||'<p>建议回顾一次新机会、一次产品调整和一次团队分歧，记录实际选择与取舍。</p>')+
block(4,'你的品牌正在积累什么长期资产？',focus.map(i=>`<p>${NAMES[i]}可能积累：${COPY[i][2]}。是否形成资产，仍需观察其长期效果。</p>`).join('')||'<p>先记录团队已经留下的经验、关系和方法，再讨论它们如何持续创造价值。</p>')+
block(5,'值得关注的两个成长机会','<p>一、'+(focus.length?focus.map(i=>COPY[i][3]).join(' '):'通过实际案例补充对团队决策方式的认识。')+'</p><p>二、邀请不同岗位独立作答，比较观察差异；同时回顾量表倾向与情境选择的不同，避免仅凭一份报告固定标签。</p>')+
block(6,'品牌生命系统的下一阶段','<p>保留团队已经认可的做事优势；选择一个实际项目，记录决策依据、行动与反馈；一个月后共同复盘是否需要更新方法。</p>')+
block(7,'人格总结',`<p>${label}：${list(focus)}。伴随人格：${list(r.companions)}。</p><p>这是本次作答的相对倾向。仅在呈现单一主导时列出次高维度作为伴随人格；其他情况以主要倾向和待核对问题为主。得分接近不代表已经构成稳定的人格组合。</p>`)+
block(8,'测评依据与完整记录',`<p>测评版本 ${VERSION} · 报告及结果规则版本 ${RULE_VERSION}<br>提交时间 ${esc(state.submittedAt||'未记录')}</p><p>有效量表题：${r.validScale.join(' / ')}（按六维顺序）。无法判断不记作中间分。任一维不足2题时，暂不判定整体主导人格。</p><p>取消3.5对报告生成的阻断。六维有效时，与最高分差距小于0.4的维度列为当前主要倾向；仅最高分达到3.5且上述候选只有一个时称主导人格，并展示其余次高分为伴随人格。同分全部保留。六维同分不强行归类；任一维不足2题时不进行完整六维排序。题间差值达到2分仅触发访谈提示。上述均为尚未验证的临时产品规则。</p><details><summary>查看24题完整作答</summary>${QUESTIONS.map(q=>`<p>Q${q.id} ${esc(q.text)}<br>答案：${esc(state.answers[q.id]==='unknown'?'暂时无法判断':state.answers[q.id])}</p>`).join('')}</details>`)+
`<section id="feedback"><h2>这份报告像你的品牌吗？</h2><p>反馈仅保存于当前设备。导出后可由你自主交给研究者。</p><label>反映真实经营状态的程度<select id="rating"><option value="">请选择</option>${[1,2,3,4,5].map(n=>`<option>${n}</option>`).join('')}</select></label><label>最准确的部分<textarea id="accurate" maxlength="3000"></textarea></label><label>最不准确的部分或难以理解的题目<textarea id="inaccurate" maxlength="3000"></textarea></label><button id="saveFeedback">保存反馈到本机</button><p id="status" role="status"></p></section><div class="actions" id="tools"></div>`;for(const id of ['rating','accurate','inaccurate'])document.getElementById(id).value=state.feedback[id]||'';document.querySelector('#saveFeedback').onclick=()=>{state.feedback=Object.fromEntries(['rating','accurate','inaccurate'].map(id=>[id,document.getElementById(id).value]));save();document.querySelector('#status').textContent=storageOK?'反馈已保存到本机，可导出分享。':'当前无法保存到本机，请立即导出记录。'};const actions=document.querySelector('#tools');actions.append(button('下载JSON数据',download),button('复制数据',async()=>{try{await navigator.clipboard.writeText(JSON.stringify(payload(),null,2));alert('数据已复制')}catch{alert('浏览器未允许复制，请使用下载JSON数据。')}}),button('打印 / 保存PDF',()=>window.print()),button('修改答案',()=>{state.index=0;question()}),button('清除记录重新开始',()=>{if(confirm('将清除本机本次答案及反馈，是否继续？')){try{localStorage.removeItem(KEY)}catch{}state={answers:{},index:0,brand:'',feedback:{}};home()}}));}
home();
</script></body></html>
